<clipPath id="k0"><rect id="r0" x="18" y="32" height="19" width="0"/></clipPath><text x="18" y="46" clip-path="url(#k0)"><tspan fill="#93A0FF">$ </tspan><tspan fill="#FFFFFF">python samples/build_vulnerable.py</tspan></text><text id="t1" x="18" y="65" fill="#8F98B6">Wrote a demo vulnerable file to /tmp/demo_vulnerable.py</text><text id="t2" x="18" y="84" fill="#D7DBEA"></text><text id="t3" x="18" y="103" fill="#F3AC40">== aws (2) ==</text><text id="t4" x="18" y="122" fill="#D7DBEA">  /tmp/demo_vulnerable.py:6 - aws_access_key_id: AKIA...HVWJ</text><text id="t5" x="18" y="141" fill="#D7DBEA">  /tmp/demo_vulnerable.py:7 - aws_secret_access_key: k7Hc...nXqL</text><text id="t6" x="18" y="160" fill="#F3AC40">== generic (1) ==</text><text id="t7" x="18" y="179" fill="#D7DBEA">  /tmp/demo_vulnerable.py:25 - generic_assignment: S7bQ...fXa2</text><text id="t8" x="18" y="198" fill="#F3AC40">== github (1) ==</text><text id="t9" x="18" y="217" fill="#D7DBEA">  /tmp/demo_vulnerable.py:9 - github_token: ghp_...8B4a</text><text id="t10" x="18" y="236" fill="#F3AC40">== google (1) ==</text><text id="t11" x="18" y="255" fill="#D7DBEA">  /tmp/demo_vulnerable.py:13 - google_api_key: AIza...UoF1</text><text id="t12" x="18" y="274" fill="#F3AC40">== jwt (1) ==</text><text id="t13" x="18" y="293" fill="#D7DBEA">  /tmp/demo_vulnerable.py:17 - jwt: eyJh...EjXk</text><text id="t14" x="18" y="312" fill="#F3AC40">== private_key (1) ==</text><text id="t15" x="18" y="331" fill="#D7DBEA">  /tmp/demo_vulnerable.py:19 - private_key_block: ----...----</text><text id="t16" x="18" y="350" fill="#F3AC40">== slack (1) ==</text><text id="t17" x="18" y="369" fill="#D7DBEA">  /tmp/demo_vulnerable.py:11 - slack_token: xoxb...uVwX</text><text id="t18" x="18" y="388" fill="#F3AC40">== stripe (1) ==</text><text id="t19" x="18" y="407" fill="#D7DBEA">  /tmp/demo_vulnerable.py:15 - stripe_live_key: sk_l...QvR5</text><text id="t20" x="18" y="426" fill="#D7DBEA"></text><text id="t21" x="18" y="445" fill="#FF8F88">9 finding(s) across 8 categories.</text><text id="t22" x="18" y="464" fill="#FF8F88">Rotate any real credential found here immediately; do not just delete the line - it is still in git </text><text id="t23" x="18" y="483" fill="#D7DBEA">    history unless you also rewrite history.</text><clipPath id="k25"><rect id="r25" x="18" y="507" height="19" width="0"/></clipPath><text x="18" y="521" clip-path="url(#k25)"><tspan fill="#93A0FF">$ </tspan><tspan fill="#FFFFFF">python scanner.py samples/fixed.py</tspan></text><text id="t26" x="18" y="540" fill="#52D293">No secrets found.</text>
